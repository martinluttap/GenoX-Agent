---
# YCSB Cassandra Stress Test
apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-stress-test
  labels:
    app: cassandra-stress-test
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        app: cassandra-stress-test
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-for-cassandra
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for Cassandra to be ready..."
          until nc -z cassandra-service 9042; do
            echo "Cassandra not ready, waiting..."
            sleep 5
          done
          echo "Cassandra is ready!"
          sleep 30
      containers:
      - name: ycsb-stress-test
        image: openjdk:8-jdk-slim
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "Starting YCSB Cassandra Stress Test"
          echo "==================================="
          echo "Test Started: $(date)"
          
          # Install dependencies
          apt-get update -qq
          apt-get install -y -qq wget python3 python3-pip curl netcat-openbsd
          
          # Fix Python for YCSB (create python2 symlink)
          ln -sf /usr/bin/python3 /usr/bin/python
          
          # Install cqlsh
          pip3 install -q cqlsh
          
          # Download YCSB JAR files directly (avoid Python script issues)
          echo "Downloading YCSB JAR files..."
          wget -q https://github.com/brianfrankcooper/YCSB/releases/download/0.15.0/ycsb-cassandra-binding-0.15.0.tar.gz
          tar -xzf ycsb-cassandra-binding-0.15.0.tar.gz
          
          # Set up Java classpath
          export YCSB_HOME="/ycsb-cassandra-binding-0.15.0"
          export CLASSPATH="$YCSB_HOME/lib/*:$YCSB_HOME/conf"
          
          # Wait for Cassandra to be fully ready
          sleep 45
          
          # Initialize results file
          mkdir -p /logs
          echo "YCSB Cassandra Stress Test Results" > /logs/ycsb-test-results.log
          echo "==================================" >> /logs/ycsb-test-results.log
          echo "Started: $(date)" >> /logs/ycsb-test-results.log
          echo "" >> /logs/ycsb-test-results.log
          
          # CSV header
          echo "workload,phase,throughput_ops_sec,avg_latency_us,p95_latency_us,p99_latency_us,runtime_ms" > /logs/throughput-data.csv
          
          # Setup Cassandra schema
          echo "Setting up Cassandra schema..."
          cat > setup.cql << 'EOF'
          DROP KEYSPACE IF EXISTS ycsb;
          CREATE KEYSPACE ycsb WITH replication = {
            'class': 'SimpleStrategy',
            'replication_factor': 1
          };
          USE ycsb;
          CREATE TABLE usertable (
            y_id varchar PRIMARY KEY,
            field0 varchar,
            field1 varchar,
            field2 varchar,
            field3 varchar,
            field4 varchar,
            field5 varchar,
            field6 varchar,
            field7 varchar,
            field8 varchar,
            field9 varchar
          );
          EOF
          
          # Setup schema with retries
          schema_created=false
          for i in {1..15}; do
            echo "Schema setup attempt $i..."
            if cqlsh cassandra-service -f setup.cql; then
              echo "Schema created successfully!"
              schema_created=true
              break
            fi
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          
          if [ "$schema_created" = false ]; then
            echo "Failed to create schema after 15 attempts"
            exit 1
          fi
          
          # Create YCSB properties
          cat > /tmp/cassandra.properties << 'EOF'
          hosts=cassandra-service
          port=9042
          cassandra.keyspace=ycsb
          cassandra.readconsistencylevel=ONE
          cassandra.writeconsistencylevel=ONE
          cassandra.connecttimeoutmillis=60000
          cassandra.readtimeoutmillis=60000
          EOF
          
          # Create workload for 5-minute mixed test
          cat > /tmp/workload_5min_mixed.properties << 'EOF'
          recordcount=10000
          operationcount=100000
          maxexecutiontime=300
          workload=site.ycsb.workloads.CoreWorkload
          readallfields=true
          readproportion=0.75
          updateproportion=0.25
          scanproportion=0
          insertproportion=0
          requestdistribution=zipfian
          threadcount=10
          EOF
          
          # Function to run YCSB using direct Java execution
          run_ycsb_test() {
            local workload=$1
            local phase=$2
            local description=$3
            local logfile="/logs/ycsb-${workload}-${phase}.log"
            
            echo "=== $description ===" | tee -a /logs/ycsb-test-results.log
            echo "Started: $(date)" | tee -a /logs/ycsb-test-results.log
            
            # Java command to run YCSB directly
            local java_cmd="java -cp $CLASSPATH site.ycsb.Client"
            
            if [ "$phase" = "load" ]; then
              timeout 600 $java_cmd -load -db site.ycsb.db.CassandraCQLClient -P /tmp/${workload}.properties -P /tmp/cassandra.properties -s > $logfile 2>&1
            else
              timeout 600 $java_cmd -t -db site.ycsb.db.CassandraCQLClient -P /tmp/${workload}.properties -P /tmp/cassandra.properties -s > $logfile 2>&1
            fi
            
            local exit_code=$?
            echo "Completed: $(date) (exit code: $exit_code)" | tee -a /logs/ycsb-test-results.log
            
            # Extract metrics if successful
            if [ $exit_code -eq 0 ] && [ -f "$logfile" ]; then
              # Extract throughput and latencies
              local throughput=$(grep "Throughput(ops/sec)" "$logfile" | tail -1 | awk '{print $3}' | tr -d ',')
              local avg_lat=$(grep "AverageLatency(us)" "$logfile" | tail -1 | awk '{print $3}' | tr -d ',')
              local p95_lat=$(grep "95thPercentileLatency(us)" "$logfile" | tail -1 | awk '{print $3}' | tr -d ',')
              local p99_lat=$(grep "99thPercentileLatency(us)" "$logfile" | tail -1 | awk '{print $3}' | tr -d ',')
              local runtime=$(grep "RunTime(ms)" "$logfile" | tail -1 | awk '{print $3}' | tr -d ',')
              
              echo "Throughput: $throughput ops/sec" | tee -a /logs/ycsb-test-results.log
              echo "Average Latency: $avg_lat μs" | tee -a /logs/ycsb-test-results.log
              echo "95th Percentile Latency: $p95_lat μs" | tee -a /logs/ycsb-test-results.log
              echo "99th Percentile Latency: $p99_lat μs" | tee -a /logs/ycsb-test-results.log
              echo "Runtime: $runtime ms" | tee -a /logs/ycsb-test-results.log
              
              # Add to CSV
              echo "$workload,$phase,$throughput,$avg_lat,$p95_lat,$p99_lat,$runtime" >> /logs/throughput-data.csv
              
              # Extract operation-specific metrics if available
              if grep -q "READ.*AverageLatency" "$logfile"; then
                local read_lat=$(grep "READ.*AverageLatency" "$logfile" | awk '{print $4}' | tr -d ',')
                local read_throughput=$(grep "READ.*Throughput" "$logfile" | awk '{print $4}' | tr -d ',')
                echo "Read Latency: $read_lat μs" | tee -a /logs/ycsb-test-results.log
                echo "Read Throughput: $read_throughput ops/sec" | tee -a /logs/ycsb-test-results.log
              fi
              
              if grep -q "UPDATE.*AverageLatency" "$logfile"; then
                local update_lat=$(grep "UPDATE.*AverageLatency" "$logfile" | awk '{print $4}' | tr -d ',')
                local update_throughput=$(grep "UPDATE.*Throughput" "$logfile" | awk '{print $4}' | tr -d ',')
                echo "Update Latency: $update_lat μs" | tee -a /logs/ycsb-test-results.log
                echo "Update Throughput: $update_throughput ops/sec" | tee -a /logs/ycsb-test-results.log
              fi
              
            else
              echo "Test failed or timed out" | tee -a /logs/ycsb-test-results.log
              echo "$workload,$phase,FAILED,FAILED,FAILED,FAILED,FAILED" >> /logs/throughput-data.csv
            fi
            
            echo "" | tee -a /logs/ycsb-test-results.log
          }
          
          echo "Starting YCSB stress tests..."
          
          # Load test data first
          run_ycsb_test "workload_5min_mixed" "load" "Data Loading Phase"
          
          # Run 5-minute mixed workload test
          run_ycsb_test "workload_5min_mixed" "run" "5-Minute Mixed Workload (75% reads, 25% updates)"
          
          echo "Test completed: $(date)" >> /logs/ycsb-test-results.log
          
          echo ""
          echo "=== YCSB STRESS TEST COMPLETED ==="
          echo "Results saved to:"
          echo "- /logs/ycsb-test-results.log (detailed results)"
          echo "- /logs/throughput-data.csv (parseable CSV)"
          echo "- Individual workload logs: /logs/ycsb-*.log"
          
          echo ""
          echo "=== FINAL RESULTS ==="
          cat /logs/ycsb-test-results.log
          
          echo ""
          echo "=== CSV DATA ==="
          cat /logs/throughput-data.csv
          
          # Keep container alive indefinitely for log extraction
          echo ""
          echo "Container will remain alive indefinitely for log extraction..."
          echo "Use 'kubectl exec' to access logs in /logs/ directory"
          echo "Available log files:"
          ls -la /logs/
          
          # Sleep indefinitely until manually stopped
          while true; do
            sleep 3600
            echo "$(date): Container still alive, logs available in /logs/"
          done
          
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - name: ycsb-logs
          mountPath: /logs
      volumes:
      - name: ycsb-logs
        emptyDir: {}